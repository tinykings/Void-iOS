name = "void-game-api"
main = "src/index.ts"
compatibility_date = "2026-06-20"

[vars]
ALLOWED_ORIGINS = "https://tinykings.github.io,https://void.tinyk.ing,http://localhost:3000,http://127.0.0.1:3000"
# The iOS app sends no Origin header. CORS was never authentication; the rate
# limiter below is what bounds direct clients.
ALLOW_ORIGINLESS_REQUESTS = "true"

# Cloudflare's native per-location rate limiter. Search, detail, and price routes
# use separate keys, so one burst does not starve another route.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 100, period = 60 }
