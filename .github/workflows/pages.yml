# Publishes web/ on every push to main: the info page at https://void.tinyk.ing/ and
# Void on the web at https://void.tinyk.ing/app/.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "package.json"
      - "Tests/fixtures/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: npm test
      - name: Build
        run: |
          mkdir -p _site
          cp -R web/index.html web/privacy.html web/home.css web/icon.png web/app-icon.png web/apple-touch-icon.png web/app web/shared _site/
          echo void.tinyk.ing > _site/CNAME
          touch _site/.nojekyll
          find _site -type f | sort
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
