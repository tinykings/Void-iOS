name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Void/Core must stay Foundation-only so these run on Linux (AGENTS.md).
  core:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test

  # Catches app build errors before they reach a device.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: >
          xcodebuild -project Void.xcodeproj -scheme Void
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
